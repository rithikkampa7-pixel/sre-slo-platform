# One command brings up the whole stack: make up
#
#   checkout-api  :8000  the service under observation
#   prometheus    :9090  scrapes, records SLIs, evaluates burn-rate alerts
#   alertmanager  :9093  routes pages vs tickets
#   grafana       :3000  SLO dashboard (anonymous admin, local only)
#   alert-sink    :8080  prints delivered alerts so you can see them fire
services:
  checkout-api:
    build: ./services/checkout-api
    ports: ["8000:8000"]
    environment:
      INJECT_ERROR_RATE: "0.002"   # ~0.2%, just inside the 99.9% SLO
      INJECT_LATENCY_MS: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    depends_on:
      checkout-api:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.0
    ports: ["9093:9093"]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.5.1
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # Tiny receiver so a fired alert is visible in `docker compose logs`
  # instead of vanishing into a dead webhook.
  alert-sink:
    image: python:3.12-slim
    command: ["python", "-u", "/app/sink.py"]
    volumes:
      - ./tools/alert-sink/sink.py:/app/sink.py:ro

volumes:
  prom-data: {}
