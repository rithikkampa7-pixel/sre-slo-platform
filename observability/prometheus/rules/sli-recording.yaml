# Recording rules for the two SLIs.
#
# Why precompute: burn-rate alerts need the same ratio over seven different
# windows. Recording them once keeps the alert expressions readable and stops
# every evaluation from re-scanning raw counters.
#
# Probe traffic (/healthz) is never instrumented in the app, so it cannot
# inflate these ratios. Only user-facing routes are counted.
#
# `or vector(0)` on the numerator is load-bearing. http_requests_total with a
# 5xx status does not exist until the first server error, and dividing an
# empty vector by anything yields an empty vector -- so a service that has
# never failed recorded NO DATA rather than 0. That is indistinguishable from
# a broken exporter and would trip the SLIDataMissing alert on a perfectly
# healthy system. Caught by this repo's own CI smoke assertion.
#
# clamp_min on the denominator avoids a divide-by-zero NaN in the window
# before any traffic has arrived at all.
groups:
  - name: sli_availability
    interval: 30s
    rules:
      - record: sli:availability:error_ratio_rate5m
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0))
            /
          clamp_min(sum(rate(http_requests_total[5m])), 1e-9)

      - record: sli:availability:error_ratio_rate30m
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[30m])) or vector(0))
            /
          clamp_min(sum(rate(http_requests_total[30m])), 1e-9)

      - record: sli:availability:error_ratio_rate1h
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[1h])) or vector(0))
            /
          clamp_min(sum(rate(http_requests_total[1h])), 1e-9)

      - record: sli:availability:error_ratio_rate2h
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[2h])) or vector(0))
            /
          clamp_min(sum(rate(http_requests_total[2h])), 1e-9)

      - record: sli:availability:error_ratio_rate6h
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[6h])) or vector(0))
            /
          clamp_min(sum(rate(http_requests_total[6h])), 1e-9)

      - record: sli:availability:error_ratio_rate1d
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[1d])) or vector(0))
            /
          clamp_min(sum(rate(http_requests_total[1d])), 1e-9)

      - record: sli:availability:error_ratio_rate3d
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[3d])) or vector(0))
            /
          clamp_min(sum(rate(http_requests_total[3d])), 1e-9)

  - name: sli_latency
    interval: 30s
    rules:
      # Fraction of requests SLOWER than the 300ms target. The le="0.3"
      # bucket exists explicitly in the app's histogram, so this needs no
      # interpolation and is exact rather than an estimated quantile.
      #
      # The denominator is the le="+Inf" bucket, NOT _count. Both equal the
      # total request count, but +Inf is part of the same histogram series
      # family as the numerator, so rate() extrapolates both identically.
      # Mixing _bucket and _count lets the two extrapolate differently at
      # window edges and can push the ratio just above 1.
      #
      # clamp_min guards the remaining edge case: a counter reset mid-window
      # (a restart or a scrape hitting a different process) can still produce
      # numerator > denominator for one evaluation. A negative "share of slow
      # requests" is meaningless, and it would silently clear a latency alert.
      - record: sli:latency:slow_ratio_rate5m
        expr: |
          clamp_min(
            1 - (
              sum(rate(http_request_duration_seconds_bucket{le="0.3"}[5m]))
                /
              sum(rate(http_request_duration_seconds_bucket{le="+Inf"}[5m]))
            ),
            0
          )

      - record: sli:latency:slow_ratio_rate1h
        expr: |
          clamp_min(
            1 - (
              sum(rate(http_request_duration_seconds_bucket{le="0.3"}[1h]))
                /
              sum(rate(http_request_duration_seconds_bucket{le="+Inf"}[1h]))
            ),
            0
          )

      - record: sli:latency:slow_ratio_rate6h
        expr: |
          clamp_min(
            1 - (
              sum(rate(http_request_duration_seconds_bucket{le="0.3"}[6h]))
                /
              sum(rate(http_request_duration_seconds_bucket{le="+Inf"}[6h]))
            ),
            0
          )
